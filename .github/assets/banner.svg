<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Neyla.tv</title>
  <desc id="desc">Neyla TV — streaming en direct et vidéos Instant pour les créateurs d'Afrique de l'Ouest francophone.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="0.6" stop-color="#141008"/>
      <stop offset="1" stop-color="#2a1f05"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#FFC81E" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFC81E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd95e"/>
      <stop offset="1" stop-color="#e6b000"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- Motif discret : lignes de signal -->
  <g stroke="#FFC81E" stroke-opacity="0.08" stroke-width="2" fill="none">
    <path d="M0 330 C 200 300, 360 360, 560 320 S 900 280, 1280 320"/>
    <path d="M0 360 C 220 330, 380 390, 600 350 S 940 310, 1280 350"/>
  </g>

  <!-- Écran / lecteur stylisé -->
  <g transform="translate(900 92)">
    <rect width="300" height="186" rx="22" fill="#111" stroke="url(#gold)" stroke-width="4"/>
    <path d="M128 62 L 188 93 L 128 124 Z" fill="url(#gold)"/>
    <g transform="translate(18 18)">
      <rect width="64" height="22" rx="6" fill="#FFC81E"/>
      <circle cx="14" cy="11" r="5" fill="#0a0a0a"/>
      <text x="25" y="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#0a0a0a">LIVE</text>
    </g>
    <!-- Vidéos courtes « Instant » -->
    <rect x="236" y="120" width="44" height="78" rx="10" fill="#1c1c1c" stroke="#FFC81E" stroke-opacity="0.6" stroke-width="2"/>
    <path d="M262 140 l-8 14 h10 l-8 14" stroke="#FFC81E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Mot-symbole -->
  <text x="88" y="200" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-3" fill="#ffffff">Neyla<tspan fill="url(#gold)">.tv</tspan></text>

  <text x="92" y="258" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#e5e7eb">Stream, gagne ta vie, change celle des autres.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#ffd95e">
    <text x="92" y="314">Live · Instant · Aura · Charity Day</text>
  </g>
  <text x="92" y="346" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#9ca3af">Afrique de l'Ouest francophone · Wave · Orange Money</text>
</svg>
