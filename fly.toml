# fly.toml app configuration file generated for neyla-tv on 2026-10-26T00:51:08Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'neyla-tv'
primary_region = 'cdg'

[build]
  dockerfile = 'infra/docker/api.Dockerfile'
  build-target = 'prod'

[deploy]
  release_command = 'sh /app/scripts/release.sh'

[env]
  CLIENT_IP_HEADER = 'Fly-Client-IP'
  DJANGO_SETTINGS_MODULE = 'config.settings.prod'
  PAYMENTS_ALLOW_FAKE = '1'
  PAYMENTS_PROVIDER = 'fake'
  REFRESH_COOKIE_SAMESITE = 'None'
  REQUIRE_STAFF_2FA = '0'
  STREAM_STATUS_POLL_SECONDS = '20'

[processes]
  app = 'daphne -b 0.0.0.0 -p 8000 --access-log - config.asgi:application'
  beat = 'celery -A config beat -l info'
  worker = 'celery -A config worker -l info --pool=solo'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/livez'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['app', 'worker']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  processes = ['beat']
